<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WARL 5 SIEGE</title>
  <style>
    :root {
      --accent-attack: #2e9bff;
      --accent-defend: #ff8a2e;
      --ink: #cfd6dd;
      --ink-dim: #7a838c;
      --bg: #05070a;
      --hud-font: 'Consolas', 'SFMono-Regular', 'Menlo', 'Roboto Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--hud-font);
      cursor: default;
      user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    /* The Three.js renderer mounts its canvas in here, full-window. */
    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* DOM overlay layer that sits on top of the canvas for all HUD/UI. */
    #ui {
      position: absolute;
      inset: 0;
      pointer-events: none; /* individual UI elements opt back into pointer events */
      z-index: 10;
    }

    /* Click-to-start / pointer-lock prompt shown before lock engages. */
    #lock-prompt {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      background: radial-gradient(circle at 50% 45%, rgba(10, 16, 24, 0.55), rgba(3, 5, 8, 0.9));
      pointer-events: auto;
      cursor: pointer;
      transition: opacity 0.25s ease;
    }

    #lock-prompt.hidden { opacity: 0; pointer-events: none; }

    .brand {
      font-size: 13vw;
      font-weight: 800;
      letter-spacing: 0.12em;
      line-height: 0.9;
      color: var(--ink);
      text-shadow: 0 0 32px rgba(46, 155, 255, 0.25);
    }
    .brand .num { color: var(--accent-attack); }

    .tagline {
      font-size: 14px;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    .cta {
      margin-top: 28px;
      font-size: 15px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent-attack);
      border: 1px solid rgba(46, 155, 255, 0.5);
      padding: 14px 34px;
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .boot-note {
      position: absolute;
      bottom: 18px;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--ink-dim);
    }

    /* Tiny build/status readout, top-left, so we can confirm the boot sequence. */
    #status {
      position: absolute;
      top: 10px;
      left: 12px;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--ink-dim);
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Three.js canvas gets inserted here by main.js -->
    <div id="ui">
      <div id="status">BOOT…</div>
      <div id="lock-prompt">
        <div class="brand">WARL&nbsp;<span class="num">5</span>&nbsp;SIEGE</div>
        <div class="tagline">Breach · Hold · Defuse</div>
        <div class="cta">Click to engage</div>
        <div class="boot-note">Original tactical FPS · prototype build · phase 0</div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
