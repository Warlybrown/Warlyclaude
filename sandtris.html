<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandtris — Tetris with Sand Physics</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0d1018; color: #cdd6f4;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    user-select: none;
  }
  h1 { margin: 8px 0 4px; font-size: 18px; letter-spacing: 2px; color: #f5c2e7; }
  #wrap { display: flex; gap: 18px; align-items: flex-start; }
  canvas { background: #11141d; border: 2px solid #313244; image-rendering: pixelated; }
  #side { font-size: 13px; line-height: 1.7; min-width: 150px; }
  #score { font-size: 26px; color: #a6e3a1; }
  .k { color: #89b4fa; }
  #over { color: #f38ba8; font-weight: bold; min-height: 18px; }
</style>
</head>
<body>
  <h1>S A N D T R I S</h1>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="side">
      <div>NEXT</div>
      <canvas id="next" width="120" height="120"
              style="background:#11141d;border:1px solid #313244;margin-bottom:6px"></canvas>
      <div>SCORE</div>
      <div id="score">0</div>
      <div id="over"></div>
      <hr style="border-color:#313244">
      <div><span class="k">← →</span> / <span class="k">A D</span> move</div>
      <div><span class="k">↑</span> / <span class="k">W</span> rotate</div>
      <div><span class="k">↓</span> / <span class="k">S</span> soft drop</div>
      <div><span class="k">space</span> hard drop</div>
      <div><span class="k">R</span> restart</div>
      <hr style="border-color:#313244">
      <div style="color:#9399b2;font-size:11px;line-height:1.5">
        Blocks dissolve into sand and fall under gravity.
        A line of one color clears when it bridges the
        <b>left wall to the right wall</b>.
      </div>
    </div>
  </div>

<script>
// ---------- Grid / sand cellular automaton ----------
const CELL = 5;            // pixel size of one sand grain
const COLS = 80;           // grid width  in grains
const ROWS = 150;          // grid height in grains
const BLOCK = 8;           // grains per tetromino square (8x8)
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nextCtx = nextCanvas.getContext('2d');
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

// 0 = empty, otherwise a color index (1..N). Stored as flat array.
const grid = new Int8Array(COLS * ROWS);
const idx = (x, y) => y * COLS + x;

// Three distinct, well-separated colors so "matching" is meaningful.
const COLORS = [
  null,
  '#f38ba8', // red
  '#a6e3a1', // green
  '#89dceb', // cyan
];

// Slight per-grain brightness jitter for a sandy texture.
const shade = new Float32Array(COLS * ROWS);

// ---------- Tetromino pieces ----------
const SHAPES = [
  [[1,1,1,1]],            // I
  [[1,1],[1,1]],          // O
  [[0,1,0],[1,1,1]],      // T
  [[1,0],[1,0],[1,1]],    // L
  [[0,1],[0,1],[1,1]],    // J
  [[0,1,1],[1,1,0]],      // S
  [[1,1,0],[0,1,1]],      // Z
];

let piece, next, score, gameOver;

// Roll a fresh {cells, color} for the queue.
function randomPiece() {
  return {
    cells: SHAPES[(Math.random() * SHAPES.length) | 0].map(r => r.slice()),
    color: 1 + ((Math.random() * (COLORS.length - 1)) | 0),
  };
}

function spawn() {
  if (!next) next = randomPiece();
  const { cells: s, color } = next;
  next = randomPiece();      // refill the preview
  drawNext();
  const startX = Math.floor((COLS / BLOCK - s[0].length) / 2);
  const startY = -s.length;
  piece = {
    cells: s,
    color,
    // logical position measured in BLOCK units (used for collision / settling)
    bx: startX,
    by: startY,
    // rendered position — eases toward the logical one for smooth motion
    rx: startX,
    ry: startY,
  };
  if (collides(piece.cells, piece.bx, piece.by)) gameOver = true;
}

// Does the block-grid piece overlap settled sand or walls?
function collides(cells, bx, by) {
  for (let r = 0; r < cells.length; r++) {
    for (let c = 0; c < cells[r].length; c++) {
      if (!cells[r][c]) continue;
      const gx = (bx + c) * BLOCK;
      const gy = (by + r) * BLOCK;
      for (let yy = 0; yy < BLOCK; yy++) {
        for (let xx = 0; xx < BLOCK; xx++) {
          const x = gx + xx, y = gy + yy;
          if (x < 0 || x >= COLS) return true;
          if (y >= ROWS) return true;
          if (y >= 0 && grid[idx(x, y)]) return true;
        }
      }
    }
  }
  return false;
}

function rotate(cells) {
  const h = cells.length, w = cells[0].length;
  const out = Array.from({ length: w }, () => new Array(h).fill(0));
  for (let r = 0; r < h; r++)
    for (let c = 0; c < w; c++)
      out[c][h - 1 - r] = cells[r][c];
  return out;
}

// Stamp the piece into the sand grid as individual grains.
function settle() {
  const { cells, color, bx, by } = piece;
  for (let r = 0; r < cells.length; r++) {
    for (let c = 0; c < cells[r].length; c++) {
      if (!cells[r][c]) continue;
      const gx = (bx + c) * BLOCK, gy = (by + r) * BLOCK;
      for (let yy = 0; yy < BLOCK; yy++) {
        for (let xx = 0; xx < BLOCK; xx++) {
          const x = gx + xx, y = gy + yy;
          if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
            grid[idx(x, y)] = color;
            shade[idx(x, y)] = 0.82 + Math.random() * 0.18;
          }
        }
      }
    }
  }
  piece = null;
}

// ---------- Sand gravity (bottom-up cellular automaton) ----------
function stepSand() {
  let moved = false;
  for (let y = ROWS - 2; y >= 0; y--) {
    // alternate scan direction per row to avoid drift bias
    const ltr = (y & 1) === 0;
    for (let i = 0; i < COLS; i++) {
      const x = ltr ? i : COLS - 1 - i;
      const here = idx(x, y);
      const col = grid[here];
      if (!col) continue;
      const below = idx(x, y + 1);
      if (!grid[below]) {                // straight down
        grid[below] = col; grid[here] = 0;
        shade[below] = shade[here]; moved = true;
        continue;
      }
      // try to slide diagonally; pick a random first direction
      const dir = Math.random() < 0.5 ? -1 : 1;
      for (const d of [dir, -dir]) {
        const nx = x + d;
        if (nx < 0 || nx >= COLS) continue;
        if (!grid[idx(nx, y + 1)] && !grid[idx(nx, y)]) {
          grid[idx(nx, y + 1)] = col; grid[here] = 0;
          shade[idx(nx, y + 1)] = shade[here]; moved = true;
          break;
        }
      }
    }
  }
  return moved;
}

// ---------- Line clearing: same color bridging left wall -> right wall ----------
// Find (but do NOT remove) every same-color region that bridges both walls.
function findMatches() {
  const visited = new Uint8Array(COLS * ROWS);
  const toClear = [];

  // Start a flood-fill from every grain on the LEFT wall.
  for (let y = 0; y < ROWS; y++) {
    const start = idx(0, y);
    const col = grid[start];
    if (!col || visited[start]) continue;

    const stack = [start];
    const region = [];
    let touchesRight = false;
    visited[start] = 1;

    while (stack.length) {
      const p = stack.pop();
      region.push(p);
      const px = p % COLS, py = (p / COLS) | 0;
      if (px === COLS - 1) touchesRight = true;
      // 4-connected neighbours of the same color
      const nb = [
        px > 0 ? p - 1 : -1,
        px < COLS - 1 ? p + 1 : -1,
        py > 0 ? p - COLS : -1,
        py < ROWS - 1 ? p + COLS : -1,
      ];
      for (const n of nb) {
        if (n < 0 || visited[n]) continue;
        if (grid[n] === col) { visited[n] = 1; stack.push(n); }
      }
    }
    if (touchesRight) toClear.push(region);
  }
  return toClear;            // array of regions; each region is an array of grain indices
}

// Remove the given regions, award score, and return how many grains were cleared.
function removeRegions(regions) {
  let cleared = 0;
  for (const region of regions) {
    for (const p of region) { grid[p] = 0; shade[p] = 0; cleared++; }
  }
  // score scales super-linearly with the size of the cleared bridge
  score += Math.round(cleared * (1 + cleared / 600));
  return cleared;
}

// ---------- Rendering ----------
function draw(now) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // During a clear, the matched grains blink: hidden for the first half of each
  // 500ms flash, shown for the second half -> "gone then reappear", 4 times.
  let hideMask = null;
  if (flash) {
    const phase = (now - flash.start) % FLASH_PERIOD;
    if (phase < FLASH_PERIOD / 2) hideMask = flash.mask;
  }
  // settled sand
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = idx(x, y);
      const col = grid[i];
      if (!col) continue;
      if (hideMask && hideMask[i]) continue;   // grain is in its "gone" flash
      ctx.fillStyle = tint(COLORS[col], shade[i]);
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }
  // active falling piece — drawn at the eased render position for smooth motion
  if (piece) {
    ctx.fillStyle = COLORS[piece.color];
    const { cells, rx, ry } = piece;
    const bs = BLOCK * CELL;
    for (let r = 0; r < cells.length; r++)
      for (let c = 0; c < cells[r].length; c++)
        if (cells[r][c])
          ctx.fillRect((rx + c) * bs, (ry + r) * bs, bs, bs);
  }
  document.getElementById('score').textContent = score;
  document.getElementById('over').textContent = gameOver ? 'GAME OVER — press R' : '';
}

// Render the upcoming piece into the preview canvas, centered and scaled to fit.
function drawNext() {
  nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!next) return;
  const { cells, color } = next;
  const w = cells[0].length, h = cells.length;
  const cell = Math.floor(Math.min(nextCanvas.width, nextCanvas.height) / 5);
  const ox = (nextCanvas.width  - w * cell) / 2;
  const oy = (nextCanvas.height - h * cell) / 2;
  nextCtx.fillStyle = COLORS[color];
  for (let r = 0; r < h; r++)
    for (let c = 0; c < w; c++)
      if (cells[r][c])
        nextCtx.fillRect(ox + c * cell, oy + r * cell, cell - 1, cell - 1);
}

// multiply a hex color by a brightness factor
function tint(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) * f) | 0;
  const g = Math.min(255, ((n >> 8) & 255) * f) | 0;
  const b = Math.min(255, (n & 255) * f) | 0;
  return `rgb(${r},${g},${b})`;
}

// ---------- Game loop ----------
let dropTimer = 0;
const DROP_INTERVAL = 14;   // frames between gravity steps for the active piece

// Flash-before-clear animation state.
const FLASH_DURATION = 1000; // total ms
const FLASH_PERIOD   = 500;  // ms per flash (gone + reappear) -> 2 flashes over 1s
let flash = null;            // { regions, mask, start }  while a clear is animating

// Frame-rate-independent easing: returns the per-frame lerp amount so the glide
// covers the same fraction per real second regardless of actual frame rate.
function easeAmt(base, dt) { return 1 - Math.pow(1 - base, dt * 60); }

let lastTime = performance.now();

function tick() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05); // clamp big gaps (tab switch)
  lastTime = now;

  if (!gameOver) {
    // sand keeps settling every frame
    stepSand();

    if (flash) {
      // hold the matched grains in place and blink them; remove when time's up.
      if (now - flash.start >= FLASH_DURATION) {
        removeRegions(flash.regions);
        flash = null;
      }
    } else if (piece) {
      // ease the rendered position toward the logical grid position, smoothly
      // and at a rate independent of frame timing (so the shift isn't janky).
      piece.rx += (piece.bx - piece.rx) * easeAmt(0.28, dt);
      piece.ry += (piece.by - piece.ry) * easeAmt(0.22, dt);
      if (Math.abs(piece.rx - piece.bx) < 0.01) piece.rx = piece.bx;
      if (Math.abs(piece.ry - piece.by) < 0.01) piece.ry = piece.by;

      dropTimer++;
      if (dropTimer >= DROP_INTERVAL) {
        dropTimer = 0;
        if (!collides(piece.cells, piece.bx, piece.by + 1)) {
          piece.by++;
        } else {
          settle();           // crumble into sand
        }
      }
    } else {
      // wait until sand mostly settles, then look for matches.
      if (!stepSand()) {
        const regions = findMatches();
        if (regions.length) {
          // build a quick lookup mask of every grain that will clear, then flash.
          const mask = new Uint8Array(COLS * ROWS);
          for (const region of regions) for (const p of region) mask[p] = 1;
          flash = { regions, mask, start: now };
        } else if (!stepSand()) {
          spawn();
        }
      }
    }
  }
  draw(now);
  requestAnimationFrame(tick);
}

// ---------- Input ----------
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'r') { reset(); return; }
  if (gameOver || !piece) return;

  const left  = k === 'arrowleft'  || k === 'a';
  const right  = k === 'arrowright' || k === 'd';
  const down  = k === 'arrowdown'  || k === 's';
  const up   = k === 'arrowup'   || k === 'w';
  const drop  = e.key === ' ';

  if (left  && !collides(piece.cells, piece.bx - 1, piece.by)) piece.bx--;
  if (right && !collides(piece.cells, piece.bx + 1, piece.by)) piece.bx++;
  if (down  && !collides(piece.cells, piece.bx, piece.by + 1)) piece.by++;
  if (up) {
    const r = rotate(piece.cells);
    if (!collides(r, piece.bx, piece.by)) piece.cells = r;
    else if (!collides(r, piece.bx - 1, piece.by)) { piece.cells = r; piece.bx--; }
    else if (!collides(r, piece.bx + 1, piece.by)) { piece.cells = r; piece.bx++; }
  }
  if (drop) {
    while (!collides(piece.cells, piece.bx, piece.by + 1)) piece.by++;
    settle();
  }
  if (left || right || up || down || drop) e.preventDefault();
});

function reset() {
  grid.fill(0); shade.fill(0);
  score = 0; gameOver = false; piece = null; next = null; dropTimer = 0; flash = null;
  spawn();
}

reset();
tick();
</script>
</body>
</html>
